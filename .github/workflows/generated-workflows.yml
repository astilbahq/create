name: Generated workflow audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: generated-workflows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate representative project
        run: pnpm generate:workflow-audit-fixture

      - name: Lint generated workflows
        uses: docker://docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color .generated-audit/.github/workflows/actionlint.yml .generated-audit/.github/workflows/codeql.yml .generated-audit/.github/workflows/dependency-review.yml .generated-audit/.github/workflows/osv-scanner.yml .generated-audit/.github/workflows/pr-title.yml .generated-audit/.github/workflows/verification.yml .generated-audit/.github/workflows/zizmor.yml

      - name: Audit generated workflows
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          advanced-security: false
          inputs: .generated-audit
          min-severity: medium
          online-audits: false
          token: ""
          version: "1.26.1"
