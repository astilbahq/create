name: Published package acceptance

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published create-astilba version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: published-package-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - git: --no-git
            install: --no-install
            label: Linux / Astro
            os: ubuntu-latest
            recipe: astro-static-site
          - git: --git
            install: --install
            label: macOS / TypeScript
            os: macos-latest
            recipe: typescript-library
          - git: --git
            install: --no-install
            label: Windows / Cloudflare Workers
            os: windows-latest
            recipe: cloudflare-worker-service
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version: "24.18.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the exact public package
        env:
          ASTILBA_ACCEPTANCE_GIT: ${{ matrix.git }}
          ASTILBA_ACCEPTANCE_INSTALL: ${{ matrix.install }}
          ASTILBA_ACCEPTANCE_RECIPE: ${{ matrix.recipe }}
          ASTILBA_ACCEPTANCE_VERSION: ${{ inputs.version }}
        run: pnpm test:published
