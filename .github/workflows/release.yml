name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify-package:
    name: Verify release package
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Confirm release commit is on main
        run: |
          release_commit="$(git rev-parse 'HEAD^{commit}')"
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "The release commit must be part of the main branch." >&2
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: pnpm exec tsx scripts/verify-release-version.ts

      - name: Verify repository
        run: pnpm verify

      - name: Pack release artifact
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/release-artifact"
          pnpm pack --json --pack-destination "$RUNNER_TEMP/release-artifact" > "$RUNNER_TEMP/pack.json"
          tarball="$(jq -r .filename "$RUNNER_TEMP/pack.json")"
          if [[ "$tarball" != /* ]]; then
            tarball="$GITHUB_WORKSPACE/$tarball"
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Record release artifact checksum
        id: checksum
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          artifact_directory="$RUNNER_TEMP/release-artifact"
          tarball_name="$(basename "$TARBALL")"
          sha256="$(sha256sum "$TARBALL" | cut -d ' ' -f 1)"
          (
            cd "$artifact_directory"
            printf '%s  %s\n' "$sha256" "$tarball_name" > SHA256SUMS
          )
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload immutable release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: error
          name: create-astilba-release
          path: |
            ${{ runner.temp }}/release-artifact/create-astilba-*.tgz
            ${{ runner.temp }}/release-artifact/SHA256SUMS
          retention-days: 1

      - name: Verify release artifact
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: pnpm exec tsx scripts/verify-packed-package.ts "$TARBALL"

      - name: Confirm local release artifact is unchanged
        env:
          EXPECTED_SHA256: ${{ steps.checksum.outputs.sha256 }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          actual_sha256="$(sha256sum "$TARBALL" | cut -d ' ' -f 1)"
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "The verified release artifact changed during package tests." >&2
            exit 1
          fi

  publish:
    name: Publish npm package
    needs: verify-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing.
    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: create-astilba-release
          path: ${{ runner.temp }}/release-artifact

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Verify release artifact checksum
        run: sha256sum --check SHA256SUMS
        working-directory: ${{ runner.temp }}/release-artifact

      - name: Publish verified artifact
        run: |
          mapfile -t tarballs < <(find "$RUNNER_TEMP/release-artifact" -maxdepth 1 -type f -name 'create-astilba-*.tgz')
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "Expected exactly one create-astilba tarball." >&2
            exit 1
          fi
          npm publish "${tarballs[0]}" --access public --provenance
